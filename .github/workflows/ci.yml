name: TravelGo CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 20}
      - name: Frontend install and build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Setup Java
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 21, cache: maven}
      - name: Backend build and tests
        working-directory: backend
        run: mvn -B verify
      - name: Build Docker images
        run: docker build -t travelgo-frontend:${{ github.sha }} ./frontend && docker build -t travelgo-backend:${{ github.sha }} ./backend
      - name: Security scan images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: travelgo-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 0
