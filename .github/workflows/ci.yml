name: TravelGo CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Frontend install and build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Setup Java
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21, cache: maven}
      - name: Backend build and tests
        working-directory: backend
        run: mvn -B verify
      - name: Build Docker images
        run: docker build -t travelgo-frontend:${{ github.sha }} ./frontend && docker build -t travelgo-backend:${{ github.sha }} ./backend
      - name: Security scan images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: travelgo-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
