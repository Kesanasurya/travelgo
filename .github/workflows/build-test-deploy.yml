name: TravelGo Build Test Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test and package backend
        working-directory: backend
        run: mvn -B verify
      - name: Build Docker images
        run: |
          docker build -t travelgo-frontend:${{ github.sha }} ./frontend
          docker build -t travelgo-backend:${{ github.sha }} ./backend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: travelgo-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

  deploy:
    name: Deploy to Kubernetes
    needs: build-test
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/travelgo-frontend:${{ github.sha }} ./frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/travelgo-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/travelgo-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/travelgo-backend:${{ github.sha }}
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Install Argo Rollouts CLI
        shell: bash
        run: |
          curl -L -o kubectl-argo-rollouts https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts
          sudo mv kubectl-argo-rollouts /usr/local/bin/kubectl-argo-rollouts
      - name: Configure Kubernetes access
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
      - name: Configure Kubernetes secrets
        shell: bash
        run: |
          kubectl create namespace travelgo --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic travelgo-secrets \
            --namespace travelgo \
            --from-literal=mysql-root-password="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --from-literal=jwt-secret="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Render image references and deploy
        shell: bash
        run: |
          sed -i "s#YOUR_DOCKERHUB_USER/travelgo-frontend:IMAGE_TAG#${{ secrets.DOCKERHUB_USERNAME }}/travelgo-frontend:${{ github.sha }}#" k8s/all-in-one.yaml
          sed -i "s#YOUR_DOCKERHUB_USER/travelgo-backend:IMAGE_TAG#${{ secrets.DOCKERHUB_USERNAME }}/travelgo-backend:${{ github.sha }}#" k8s/all-in-one.yaml
          kubectl apply -f k8s/all-in-one.yaml
          kubectl rollout status deployment/mysql -n travelgo --timeout=180s
          kubectl rollout status deployment/travelgo-backend -n travelgo --timeout=180s
          kubectl argo rollouts status travelgo-frontend -n travelgo --timeout=180s
