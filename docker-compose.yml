services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: travelgo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-travelgo-dev}
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 5000
      DB_URL: jdbc:mysql://mysql:3306/travelgo?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-travelgo-dev}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["5000:5000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  mysql_data:
