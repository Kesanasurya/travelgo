apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelgo-backend
  namespace: travelgo
spec:
  replicas: 2
  selector:
    matchLabels: {app: travelgo-backend}
  template:
    metadata:
      labels: {app: travelgo-backend}
    spec:
      containers:
      - name: backend
        image: YOUR_DOCKERHUB_USER/travelgo-backend:IMAGE_TAG
        ports: [{containerPort: 5000}]
        env:
        - {name: PORT, value: "5000"}
        - {name: DB_URL, value: jdbc:mysql://mysql:3306/travelgo?createDatabaseIfNotExist=true&serverTimezone=UTC}
        - {name: DB_USERNAME, value: root}
        - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: travelgo-secrets, key: mysql-root-password}}}
        - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: travelgo-secrets, key: jwt-secret}}}
        - {name: CORS_ALLOWED_ORIGINS, valueFrom: {configMapKeyRef: {name: travelgo-config, key: cors-origins}}}
        readinessProbe: {httpGet: {path: /actuator/health, port: 5000}, initialDelaySeconds: 25, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: travelgo-backend
  namespace: travelgo
spec:
  selector: {app: travelgo-backend}
  ports: [{port: 5000, targetPort: 5000}]
