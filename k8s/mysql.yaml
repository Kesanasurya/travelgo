apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: travelgo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: travelgo
spec:
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        ports: [{containerPort: 3306}]
        env:
        - {name: MYSQL_DATABASE, value: travelgo}
        - {name: MYSQL_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: travelgo-secrets, key: mysql-root-password}}}
        volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
        readinessProbe:
          exec: {command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]}
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: mysql-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: travelgo
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: 3306}]
